<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="Uma coleção curada de arte digital e colecionáveis NFT." />
    <title>Formas raras — Coleção NFT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="collection" aria-labelledby="collection-title">
        <div class="collection__intro">
          <p class="eyebrow"><span class="eyebrow__dot"></span> EDIÇÃO 001 <span class="eyebrow__divider">/</span> ARTE DIGITAL</p>
          <h1 id="collection-title">Peças únicas.<br /><span>Outras realidades.</span></h1>
          <p class="collection__description">Uma coleção de objetos digitais feitos para morar fora do óbvio.</p>
          <div class="collection__meta"><span>COLEÇÃO ABERTA</span><span class="meta__rule"></span><span>06 PEÇAS</span></div>
        </div>

        <div class="gallery-toolbar">
          <h2>Peças em destaque <span>06</span></h2>
          <p>ORDENADO POR <strong>RECENTES <span aria-hidden="true">↘</span></strong></p>
        </div>

        <div class="card-list" id="card-list" aria-live="polite"></div>

        <footer class="collection-footer">
          <span>FORMAS RARAS <span class="footer__slash">/</span> 2026</span>
          <span>ARTE QUE NÃO FICA PARADA.</span>
        </footer>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>

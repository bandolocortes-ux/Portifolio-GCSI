<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Equilibrium #3429, uma peça da coleção Equilibrium."
    />
    <title>Equilibrium #3429 | NFT Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <article class="nft-card" aria-labelledby="nft-title">
        <div class="artwork">
          <img
            class="artwork__image"
            src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=900&q=85"
            alt="Arte digital abstrata da coleção Equilibrium"
          />
          <div class="artwork__overlay" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="presentation">
              <path d="M24 10C13.5 10 5.1 20.4 3 24c2.1 3.6 10.5 14 21 14s18.9-10.4 21-14C42.9 20.4 34.5 10 24 10Zm0 23a9 9 0 1 1 0-18 9 9 0 0 1 0 18Zm0-5a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
            </svg>
          </div>
        </div>

        <div class="nft-card__content">
          <h1 id="nft-title">Equilibrium #3429</h1>
          <p class="description">
            Nossa coleção Equilibrium promove equilíbrio e calma.
          </p>

          <div class="details" aria-label="Detalhes do NFT">
            <p class="price">
              <svg viewBox="0 0 11 18" aria-hidden="true">
                <path d="m5.5 0 5.2 8.8-5.2 3.1L.3 8.8 5.5 0Zm0 13.1 5.2-3.1-5.2 7.6-5.2-7.6 5.2 3.1Z" />
              </svg>
              <span>0.041 ETH</span>
            </p>
            <p class="time-left">
              <svg viewBox="0 0 17 17" aria-hidden="true">
                <path d="M8.5 0a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm0 15a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13Zm.5-11H7.5v5l4 2.4.8-1.3L9 8V4Z" />
              </svg>
              <span>3 dias restantes</span>
            </p>
          </div>

          <div class="creator">
            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=96&h=96&q=80"
              alt=""
              class="creator__avatar"
            />
            <p>Criado por <span>Jules Wyvern</span></p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
